name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      maintenance_mode:
        description: 'Show maintenance page ("technical works in progress")'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Resolve maintenance mode
        id: maint
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_FLAG: ${{ inputs.maintenance_mode }}
          REPO_VAR: ${{ vars.MAINTENANCE_MODE }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RAW="$DISPATCH_FLAG"
          else
            RAW="${REPO_VAR:-false}"
          fi
          RAW_LC=$(printf '%s' "$RAW" | tr '[:upper:]' '[:lower:]')
          case "$RAW_LC" in
            true|1|yes|on) FLAG=true ;;
            *) FLAG=false ;;
          esac
          echo "enabled=$FLAG" >> "$GITHUB_OUTPUT"
          echo "Maintenance mode for this build: $FLAG"

      - name: Build production
        run: npm run build
        env:
          VITE_MAINTENANCE_MODE: ${{ steps.maint.outputs.enabled }}
          VITE_GOOGLE_MAPS_EMBED_KEY: ${{ secrets.VITE_GOOGLE_MAPS_EMBED_KEY }}

      - name: Assemble site root
        run: |
          mkdir -p _site
          cp -a dist/. _site/

      - name: Attach staging preview (branch staging)
        env:
          VITE_GOOGLE_MAPS_EMBED_KEY: ${{ secrets.VITE_GOOGLE_MAPS_EMBED_KEY }}
        run: |
          if ! git fetch --depth=1 origin staging 2>/dev/null; then
            echo "No origin/staging branch — skipping /staging/"
            exit 0
          fi
          git worktree add "$RUNNER_TEMP/jab-staging" origin/staging
          cd "$RUNNER_TEMP/jab-staging"
          npm ci
          VITE_STAGING=true npm run build
          mkdir -p "$GITHUB_WORKSPACE/_site/staging"
          cp -a dist/. "$GITHUB_WORKSPACE/_site/staging/"
          printf 'User-agent: *\nDisallow: /\n' > "$GITHUB_WORKSPACE/_site/staging/robots.txt"
          rm -f "$GITHUB_WORKSPACE/_site/staging/CNAME" "$GITHUB_WORKSPACE/_site/staging/sitemap.xml"
          echo "Staging preview attached at /staging/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
